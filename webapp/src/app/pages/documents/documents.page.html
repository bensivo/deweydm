<div class="documents-page">
    <div class="page-header">
        <h1>Documents</h1>
        <button nz-button nzType="primary" nzSize="large" (click)="onClickUpload()">+ Upload</button>
    </div>

    <div class="page-toolbar">
        <input
            nz-input
            nzSize="large"
            placeholder="Search by name..."
            [(ngModel)]="searchQuery"
            class="search-input" />
    </div>

    <nz-table
        [nzData]="filteredDocuments"
        [nzShowPagination]="true"
        [nzPageSize]="20"
        nzSize="middle">
        <thead>
            <tr>
                <th>Name</th>
                <th>Original File</th>
                <th>Description</th>
                <th>Linked Records</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let doc of filteredDocuments" class="table-row" (click)="onClickRow(doc)">
                <td>{{ doc.name }}</td>
                <td>{{ doc.originalFileName }}</td>
                <td class="description-cell">{{ doc.description }}</td>
                <td>{{ doc.linkedRecords.length }}</td>
                <td>{{ doc.createdAt | date:'medium' }}</td>
            </tr>
        </tbody>
    </nz-table>
</div>

<app-document-upload-modal
    [isOpen]="isUploadModalOpen"
    (onSubmit)="onUploadSubmit($event)"
    (onCancel)="onUploadCancel()">
</app-document-upload-modal>
