<div class="entity-detail-container">
  <div class="page-header">
    <button nz-button nzType="text" (click)="onClickBackButton()">← Back</button>
  </div>

  <div *ngIf="entity$() && record$()" class="entity-detail-content">
    <div class="detail-header">
      <h1>{{ entity$()!.name }}</h1>
      <button nz-button nzDanger nzType="text" (click)="onClickDelete()">Delete</button>
    </div>

    <nz-card class="fields-card" [nzTitle]="detailsCardTitle">
      <ng-template #detailsCardTitle>
        <div class="details-card-header">
          <span>Details</span>
          <div class="details-card-actions">
            <ng-container *ngIf="!isEditMode()">
              <button nz-button nzType="default" nzSize="small" (click)="onClickEdit()">Edit</button>
            </ng-container>
            <ng-container *ngIf="isEditMode()">
              <button nz-button nzType="default" nzSize="small" (click)="onClickCancelEdit()">Cancel</button>
              <button nz-button nzType="primary" nzSize="small" (click)="onClickSave()">Save</button>
            </ng-container>
          </div>
        </div>
      </ng-template>
      <ng-container *ngFor="let field of entity$()!.fields">
        <div class="field-row" *ngIf="!isEditMode() || field.type !== 'backlink'">
          <div class="field-label">{{ field.name }}</div>
        <div class="field-value">
          <!-- View mode -->
          <ng-container *ngIf="!isEditMode()">
            <!-- Reference field: show as link -->
            <app-entity-reference *ngIf="field.type === 'reference' && getFieldValue(field.id)"
              [recordId]="getFieldValue(field.id)">
            </app-entity-reference>
            <span *ngIf="field.type === 'reference' && !getFieldValue(field.id)">—</span>
            <!-- Backlink field: show as list of links -->
            <div *ngIf="field.type === 'backlink'" class="backlink-list">
              <div *ngIf="getBacklinkedRecords(field).length === 0" class="empty-backlinks">No linked records</div>
              <app-entity-reference *ngFor="let backlinkRecord of getBacklinkedRecords(field)"
                [recordId]="backlinkRecord.id"
                class="backlink-item">
              </app-entity-reference>
            </div>
            <!-- Reference list field: show as list of links -->
            <div *ngIf="field.type === 'reference-list'" class="backlink-list">
              <div *ngIf="getRefListViewItems(field).length === 0" class="empty-backlinks">—</div>
              <app-entity-reference *ngFor="let item of getRefListViewItems(field)"
                [recordId]="item.id"
                class="backlink-item">
              </app-entity-reference>
            </div>
            <!-- Basic fields: show as text -->
            <span *ngIf="field.type === 'short-text' || field.type === 'long-text' || field.type === 'number' || field.type === 'option'">
              {{ getFieldValue(field.id) || '—' }}
            </span>
          </ng-container>

          <!-- Edit mode: long-text gets textarea -->
          <textarea
            *ngIf="isEditMode() && field.type === 'long-text'"
            nz-input
            [nzAutosize]="{ minRows: 2, maxRows: 6 }"
            [ngModel]="getEditValue(field.id)"
            (ngModelChange)="setEditValue(field.id, $event)"
            [name]="field.id">
          </textarea>

          <!-- Edit mode: reference fields get select -->
          <nz-select *ngIf="isEditMode() && field.type === 'reference'"
            nzPlaceHolder="Select..."
            [ngModel]="getEditValue(field.id)"
            (ngModelChange)="setEditValue(field.id, $event)"
            [name]="field.id">
            <nz-option
              *ngFor="let opt of getReferenceOptions(field)"
              [nzValue]="opt.recordId"
              [nzLabel]="opt.recordName">
            </nz-option>
          </nz-select>

          <!-- Edit mode: option fields get select -->
          <nz-select *ngIf="isEditMode() && field.type === 'option'"
            nzPlaceHolder="Select..."
            [ngModel]="getEditValue(field.id)"
            (ngModelChange)="setEditValue(field.id, $event)"
            [name]="field.id">
            <nz-option *ngFor="let val of field.optionValues" [nzValue]="val" [nzLabel]="val"></nz-option>
          </nz-select>

          <!-- Edit mode: reference-list fields get multi-select -->
          <nz-select *ngIf="isEditMode() && field.type === 'reference-list'"
            nzMode="multiple"
            nzPlaceHolder="Select..."
            [ngModel]="getRefListValues(field.id)"
            (ngModelChange)="setRefListValues(field.id, $event)"
            [name]="field.id">
            <nz-option
              *ngFor="let opt of getReferenceOptions(field)"
              [nzValue]="opt.recordId"
              [nzLabel]="opt.recordName">
            </nz-option>
          </nz-select>

          <!-- Edit mode: all other types get a standard input -->
          <input
            *ngIf="isEditMode() && (field.type === 'short-text' || field.type === 'number')"
            nz-input
            [type]="field.type === 'number' ? 'number' : 'text'"
            [ngModel]="getEditValue(field.id)"
            (ngModelChange)="setEditValue(field.id, $event)"
            [name]="field.id" />
        </div>
        </div>
      </ng-container>
    </nz-card>

    <!-- Notes Section -->
    <nz-card class="notes-card" [nzTitle]="notesCardTitle">
      <ng-template #notesCardTitle>
        <div class="notes-card-header">
          <span>Notes</span>
          <div class="notes-card-btn-container">
            <button nz-button nzType="default" nzSize="small" (click)="onClickCreateNote()">+ New</button>
            <button nz-button nzType="default" nzSize="small" (click)="onClickLinkExistingNote()">+ Link Existing</button>
          </div>
        </div>
      </ng-template>

      <div *ngIf="linkedNotes$().length === 0" class="no-notes">No notes</div>

      <div *ngFor="let note of linkedNotes$()" class="note-row">
        <a [routerLink]="['/notes', note.id]" class="note-name">{{ note.name }}</a>
        <button nz-button nzType="text" nzDanger nzSize="small"
                nz-tooltip nzTooltipTitle="Unlink note"
                (click)="onClickUnlinkNote(note.id)">
          <span nz-icon nzType="disconnect"></span>
        </button>
      </div>
    </nz-card>
  </div>

    <!-- Documents Section -->
    <nz-card class="documents-card" [nzTitle]="documentCardTitle">
      <ng-template #documentCardTitle>
        <div class="documents-card-header">
          <span>Documents</span>
          <div class="documents-card-btn-container">
            <button nz-button nzType="default" nzSize="small" (click)="onClickUploadDocument()">+ Upload</button>
            <button nz-button nzType="default" nzSize="small" (click)="onClickLinkExisting()">+ Link Existing</button>
          </div>
        </div>
      </ng-template>

      <div *ngIf="linkedDocuments$().length === 0" class="no-documents">No documents</div>

      <div *ngFor="let doc of linkedDocuments$()" class="document-row">
        <a [routerLink]="['/documents', doc.id]" class="document-name">{{ doc.name }}</a>
        <button nz-button nzType="text" nzDanger nzSize="small"
                nz-tooltip nzTooltipTitle="Unlink document"
                (click)="onClickUnlinkDocument(doc.id)">
          <span nz-icon nzType="disconnect"></span>
        </button>
      </div>
    </nz-card>

  <app-document-upload-modal
    [isOpen]="isUploadModalOpen()"
    (onSubmit)="onUploadDocumentSubmit($event)"
    (onCancel)="onUploadDocumentCancel()">
  </app-document-upload-modal>

  <app-document-link-modal
    [isOpen]="isLinkModalOpen()"
    [documents]="allDocuments$()"
    (onSelect)="onLinkDocumentSelect($event)"
    (onCancel)="onLinkDocumentCancel()">
  </app-document-link-modal>

  <app-note-create-modal
    [isOpen]="isNoteCreateModalOpen()"
    (onSubmit)="onCreateNoteSubmit($event)"
    (onCancel)="onCreateNoteCancel()">
  </app-note-create-modal>

  <app-note-link-modal
    [isOpen]="isNoteLinkModalOpen()"
    [notes]="allNotes$()"
    (onSelect)="onLinkNoteSelect($event)"
    (onCancel)="onLinkNoteCancel()">
  </app-note-link-modal>

  <!-- Delete Confirmation Modal -->
  <nz-modal
    [(nzVisible)]="isDeleteConfirmModalOpen"
    nzTitle="Delete Record"
    nzOkText="Delete"
    nzOkType="primary"
    nzOkDanger
    nzCancelText="Cancel"
    (nzOnOk)="onConfirmDelete()"
    (nzOnCancel)="onCancelDelete()">
    <ng-container *nzModalContent>
      <p>Are you sure you want to delete this {{ entity$()?.name }}?</p>
      <p style="color: #8c8c8c; font-size: 12px;">This action cannot be undone.</p>
    </ng-container>
  </nz-modal>
</div>
